<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} · soahcerup@notes</title>
<meta name="description" content="{{EXCERPT}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="titlebar-row">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="titlebar-path">soahcerup@notes: ~/writeups/{{SLUG}}.md</span>
  </div>
  <nav class="nav">
    <a href="index.html" class="brand">
      <span class="prompt-user">soahcerup</span><span class="prompt-sep">@notes:~$</span>
      <span class="prompt-cursor">_</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu">menu</button>
    <ul class="nav-links">
      <li><a href="index.html">./home</a></li>
      <li><a href="writeups.html" class="active">./writeups</a></li>
      <li><a href="blog.html">./blog</a></li>
      <li><a href="about.html">./about</a></li>
    </ul>
  </nav>
</header>

<main>
  <div class="post-header wrap">
    <div class="post-path">~/writeups/{{SLUG}}.md</div>
    <h1 class="post-title">{{TITLE}}</h1>
    <div class="post-meta">
      <span>{{PLATFORM}}</span>
      <span class="badge {{DIFFICULTY_CLASS}}">{{DIFFICULTY_LABEL}}</span>
      <span>{{DATE_DISPLAY}}</span>
      <span>{{TAGS_META}}</span>
    </div>
  </div>

  <article class="prose">
{{CONTENT}}
  </article>
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span>soahcerup@notes — last updated {{BUILD_DATE}}</span>
    <div class="footer-links">
      <a href="https://github.com/Soahcerup" target="_blank" rel="noopener">github</a>
      <a href="https://x.com/" target="_blank" rel="noopener">x/twitter</a>
      <a href="mailto:mmts.cool@gmail.com">email</a>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
